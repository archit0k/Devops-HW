apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels: {app: studyslot-frontend}
  template:
    metadata:
      labels: {app: studyslot-frontend}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 101, runAsGroup: 101}
      containers:
        - name: frontend
          image: "{{ .Values.frontend.repository }}:{{ required "Set imageTag to a tested Git SHA" .Values.imageTag }}"
          ports:
            - {name: http, containerPort: 8080}
          resources: {{ toYaml .Values.resources.frontend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /frontend-health, port: http}
            periodSeconds: 3
            failureThreshold: 20
          readinessProbe:
            httpGet: {path: /frontend-health, port: http}
          livenessProbe:
            httpGet: {path: /frontend-health, port: http}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
spec:
  type: ClusterIP
  selector: {app: studyslot-frontend}
  ports:
    - {name: http, port: 8080, targetPort: http}
