apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  {{- if not .Values.hpa.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels: {app: studyslot-backend}
  template:
    metadata:
      labels: {app: studyslot-backend}
      annotations:
        prometheus.io/scrape: 'true'
        prometheus.io/port: '8000'
        prometheus.io/path: /metrics
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets: {{ toYaml . | nindent 8 }}
      {{- end }}
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      initContainers:
        - name: migrate
          image: "{{ .Values.backend.repository }}:{{ required "Set imageTag to a tested Git SHA" .Values.imageTag }}"
          command: [sh, -c]
          args:
            - >-
              until python -c "import os; from sqlalchemy import create_engine,text; create_engine(os.environ['DATABASE_URL']).connect().execute(text('SELECT 1'))";
              do sleep 3; done;
              alembic upgrade head
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: url}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      containers:
        - name: backend
          image: "{{ .Values.backend.repository }}:{{ .Values.imageTag }}"
          envFrom:
            - configMapRef: {name: studyslot-config}
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef: {name: {{ .Values.database.existingSecret }}, key: url}
          ports:
            - {name: http, containerPort: 8000}
          resources: {{ toYaml .Values.resources.backend | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          startupProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 5
            failureThreshold: 30
          readinessProbe:
            httpGet: {path: /ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: http}
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  labels: {app: studyslot-backend}
spec:
  type: ClusterIP
  selector: {app: studyslot-backend}
  ports:
    - {name: http, port: 8000, targetPort: http}
