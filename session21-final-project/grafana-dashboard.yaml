apiVersion: v1
kind: ConfigMap
metadata:
  name: archit-taskboard-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  taskboard.json: |
    {
      "uid": "archit-taskboard",
      "title": "TaskBoard - Archit Kulkarni - 24BCS10194",
      "schemaVersion": 39,
      "version": 1,
      "refresh": "10s",
      "time": {"from": "now-15m", "to": "now"},
      "panels": [
        {"id": 1, "title": "Backend scrape is up", "type": "stat", "gridPos": {"x": 0, "y": 0, "w": 8, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum(up{namespace=\"taskboard\"})", "refId": "A"}]},
        {"id": 2, "title": "HTTP requests recorded", "type": "stat", "gridPos": {"x": 8, "y": 0, "w": 8, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum(http_requests_total{namespace=\"taskboard\"})", "refId": "A"}]},
        {"id": 3, "title": "Backend replicas", "type": "stat", "gridPos": {"x": 16, "y": 0, "w": 8, "h": 5},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "kube_deployment_status_replicas_available{namespace=\"taskboard\",deployment=\"taskboard-taskboard-backend\"}", "refId": "A"}]},
        {"id": 4, "title": "HTTP request rate", "type": "timeseries", "gridPos": {"x": 0, "y": 5, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum by(handler) (rate(http_requests_total{namespace=\"taskboard\"}[2m]))", "legendFormat": "{{handler}}", "refId": "A"}]},
        {"id": 5, "title": "Backend CPU seconds per second", "type": "timeseries", "gridPos": {"x": 12, "y": 5, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"taskboard\",container=\"backend\"}[2m]))", "refId": "A"}]},
        {"id": 6, "title": "Request latency (95th percentile)", "type": "timeseries", "gridPos": {"x": 0, "y": 13, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "histogram_quantile(0.95,sum by(le)(rate(http_request_duration_seconds_bucket{namespace=\"taskboard\"}[2m])))", "refId": "A"}]},
        {"id": 7, "title": "HTTP 5xx errors per second", "type": "timeseries", "gridPos": {"x": 12, "y": 13, "w": 12, "h": 8},
         "datasource": {"type": "prometheus", "uid": "prometheus"},
         "targets": [{"expr": "sum(rate(http_requests_total{namespace=\"taskboard\",status=\"5xx\"}[2m])) or vector(0)", "refId": "A"}]}
      ]
    }
