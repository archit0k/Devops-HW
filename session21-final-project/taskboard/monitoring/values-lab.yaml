# Temporary classroom monitoring; no public endpoint or persistent dashboard DB.
alertmanager:
  enabled: false
grafana:
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1, memory: 1Gi}
prometheus:
  prometheusSpec:
    retention: 2h
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 1Gi}
