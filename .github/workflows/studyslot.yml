name: StudySlot checks and deployment
on:
  push:
    branches: [main]
  pull_request:
    paths: ['project/**', '.github/workflows/studyslot.yml']
  workflow_dispatch:

permissions:
  contents: read
concurrency:
  group: studyslot-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: project/backend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: '3.14'
      - run: pip install -r requirements-dev.txt
      - name: API tests (isolated test database)
        run: pytest -v --junitxml=test-results.xml
      - name: Code quality and SAST
        run: |
          ruff check app tests alembic
          bandit -r app -ll
      - name: Python dependency audit
        run: pip-audit -r requirements.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studyslot-tests
          path: project/backend/test-results.xml
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: project/frontend
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.0.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run build
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: studyslot-frontend
          path: project/frontend/dist
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - name: Scan Git history for secrets
        run: |
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 -o /tmp/checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          cd /tmp
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --redact --verbose --report-format json --report-path gitleaks-report.json
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studyslot-secret-scan
          path: gitleaks-report.json
  images:
    needs: [test, frontend, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install verified Trivy release
        run: |
          curl -fsSL --retry 3 -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          curl -fsSL --retry 3 -o /tmp/trivy-checksums.txt https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_checksums.txt
          cd /tmp
          grep ' trivy_0.75.0_Linux-64bit.tar.gz$' trivy-checksums.txt | sed 's/trivy_0.75.0_Linux-64bit.tar.gz/trivy.tar.gz/' | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
      - name: Build both non-root images
        run: |
          docker build --pull -t studyslot-backend:${GITHUB_SHA} project/backend
          docker build --pull -t studyslot-frontend:${GITHUB_SHA} project/frontend
      - name: HIGH and CRITICAL security gate (both images)
        run: |
          mkdir -p scan-results
          scan_status=0
          /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table --output scan-results/backend.txt studyslot-backend:${GITHUB_SHA} || scan_status=1
          cat scan-results/backend.txt
          /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table --output scan-results/frontend.txt studyslot-frontend:${GITHUB_SHA} || scan_status=1
          cat scan-results/frontend.txt
          exit "$scan_status"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studyslot-image-scans
          path: scan-results
      - name: Compose integration and non-root check
        run: |
          set -euo pipefail
          mkdir -p project-evidence
          bash project/scripts/run-compose.sh 2>&1 | tee project-evidence/compose.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studyslot-compose
          path: project-evidence
      - name: Publish SHA-tagged images only after all gates pass
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          for app in backend frontend; do
            image="ghcr.io/${owner}/studyslot-${app}:${GITHUB_SHA}"
            docker tag "studyslot-${app}:${GITHUB_SHA}" "$image"
            docker push "$image"
          done
      - name: Export the exact scanned images for deployment
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          docker save "ghcr.io/${owner}/studyslot-backend:${GITHUB_SHA}" "ghcr.io/${owner}/studyslot-frontend:${GITHUB_SHA}" | gzip > studyslot-images.tar.gz
      - uses: actions/upload-artifact@v7.0.2
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          name: studyslot-tested-images
          path: studyslot-images.tar.gz
          retention-days: 3
  deploy:
    needs: images
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v7.0.0
        with:
          name: studyslot-tested-images
      - name: Create an isolated Kubernetes cluster
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSL --retry 3 -o /tmp/kind.sha256sum https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          curl -fsSL --retry 3 -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          curl -fsSL --retry 3 -o /tmp/helm.sha256sum https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz.sha256sum
          cd /tmp
          echo "$(cut -d ' ' -f 1 kind.sha256sum)  kind" | sha256sum -c -
          echo "$(cut -d ' ' -f 1 helm.sha256sum)  helm.tar.gz" | sha256sum -c -
          chmod +x kind
          tar -xzf helm.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          /tmp/kind create cluster --name studyslot-ci --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --wait 120s
      - name: Deploy and verify the scanned images
        run: |
          set -euo pipefail
          mkdir -p project-evidence
          docker load -i studyslot-images.tar.gz
          /tmp/kind load docker-image "ghcr.io/archit0k/studyslot-backend:${GITHUB_SHA}" "ghcr.io/archit0k/studyslot-frontend:${GITHUB_SHA}" --name studyslot-ci
          bash project/scripts/run-ci-deploy.sh "$GITHUB_SHA" 2>&1 | tee project-evidence/kubernetes.txt
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studyslot-kubernetes
          path: project-evidence
      - name: Remove the runner cluster
        if: always()
        run: /tmp/kind delete cluster --name studyslot-ci
  deploy_aws:
    needs: images
    if: github.ref == 'refs/heads/main' && vars.ENABLE_EKS_CD == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: StudySlot-GitHub-Actions
      - name: Install verified Helm client
        run: |
          curl -fsSL --retry 3 -o /tmp/helm-v3.22.0-linux-amd64.tar.gz https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          curl -fsSL --retry 3 -o /tmp/helm.sha256 https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz.sha256
          cd /tmp
          echo "$(cat helm.sha256)  helm-v3.22.0-linux-amd64.tar.gz" | sha256sum -c -
          tar -xzf helm-v3.22.0-linux-amd64.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Deploy the tested SHA to EKS
        run: |
          aws eks update-kubeconfig --name archit-studyslot --region us-east-1
          helm upgrade --install studyslot project/helm/studyslot -n studyslot \
            --set imageTag="${GITHUB_SHA}" --set database.storageClass=studyslot-gp3 \
            --set ingress.host=studyslot.127.0.0.1.sslip.io --set monitoring.serviceMonitor=true \
            --wait --timeout 10m
          kubectl get pods,svc,ingress,hpa,pvc -n studyslot
          helm list -n studyslot
