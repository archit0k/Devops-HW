name: DevSecOps homework
on:
  push:
    branches: [main]
    paths: ['session17-devsecops/**', '.github/workflows/devsecops.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v7.0.0
        with: {python-version: '3.14'}
      - run: pip install -r session17-devsecops/requirements-dev.txt
      - name: Unit tests, SAST and SCA
        run: |
          cd session17-devsecops
          pytest -v
          bandit -r app.py -c security/bandit.yaml -ll
          pip-audit -r requirements.txt
      - name: Secret scan (entire Git history)
        run: |
          curl -fsSL --retry 3 -o /tmp/gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSL --retry 3 -o /tmp/checksums.txt https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          cd /tmp
          grep ' gitleaks_8.30.1_linux_x64.tar.gz$' checksums.txt | sed 's/gitleaks_8.30.1_linux_x64.tar.gz/gitleaks.tar.gz/' | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          cd "$GITHUB_WORKSPACE"
          /tmp/gitleaks git --redact --verbose
  build-scan-publish-deploy:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build image
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/homework-api:${GITHUB_SHA}"
          echo "IMAGE=$image" >> "$GITHUB_ENV"
          docker build --pull -t "$image" session17-devsecops
      - name: Install verified Trivy
        run: |
          curl -fsSL --retry 3 -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          curl -fsSL --retry 3 -o /tmp/trivy-checksums.txt https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_checksums.txt
          cd /tmp
          grep ' trivy_0.75.0_Linux-64bit.tar.gz$' trivy-checksums.txt | sed 's/trivy_0.75.0_Linux-64bit.tar.gz/trivy.tar.gz/' | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
      - name: Container security gate
        run: /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"
      - name: Publish tested SHA
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "${GITHUB_ACTOR}" --password-stdin
          docker push "$IMAGE"
      - name: Deploy and test in a real disposable Kubernetes cluster
        run: |
          curl -fsSL --retry 3 -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSL --retry 3 -o /tmp/kind.sha256sum https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          cd /tmp
          echo "$(cut -d ' ' -f 1 kind.sha256sum)  kind" | sha256sum -c -
          chmod +x kind
          cd "$GITHUB_WORKSPACE"
          /tmp/kind create cluster --name homework --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --wait 120s
          trap '/tmp/kind delete cluster --name homework' EXIT
          /tmp/kind load docker-image "$IMAGE" --name homework
          kubectl apply -f session17-devsecops/kubernetes/deployment.yaml
          kubectl set image deployment/homework-api app="$IMAGE"
          kubectl rollout status deployment/homework-api --timeout=180s
          kubectl get pods,svc -o wide
          kubectl run smoke --image=curlimages/curl:latest --restart=Never -- -fsS http://homework-api/health
          kubectl wait --for=jsonpath='{.status.phase}'=Succeeded pod/smoke --timeout=120s
          kubectl logs smoke
