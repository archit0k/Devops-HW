name: StudySlot AWS setup and checks
on:
  workflow_dispatch:
    inputs:
      action:
        type: choice
        required: true
        options: [bootstrap, configure-access, verify, cleanup]
      image_sha:
        description: SHA already built and scanned by the StudySlot pipeline
        required: true
        type: string
permissions:
  contents: read
  packages: read
  id-token: write
jobs:
  aws_lab:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          role-session-name: StudySlot-Lab
      - name: Install verified Helm
        run: |
          curl -fsSL --retry 3 -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          curl -fsSL --retry 3 -o /tmp/helm.sha256sum https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz.sha256sum
          cd /tmp
          echo "$(cut -d ' ' -f 1 helm.sha256sum)  helm.tar.gz" | sha256sum -c -
          tar -xzf helm.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
      - name: Connect to the project cluster
        run: aws eks update-kubeconfig --name archit-studyslot --region us-east-1
      - name: Run the requested lab action
        env:
          LAB_ACTION: ${{ inputs.action }}
          TESTED_SHA: ${{ inputs.image_sha }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          [[ "$TESTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p project-evidence
          if [[ "$LAB_ACTION" == bootstrap ]]; then
            bash project/scripts/bootstrap-aws.sh "$TESTED_SHA" 2>&1 | tee project-evidence/aws-bootstrap.txt
          elif [[ "$LAB_ACTION" == configure-access ]]; then
            {
              kubectl apply -f project/k8s/ci-monitoring-rbac.yaml
              kubectl -n studyslot get role,rolebinding
            } 2>&1 | tee project-evidence/aws-access.txt
          elif [[ "$LAB_ACTION" == verify ]]; then
            bash project/scripts/verify-aws.sh 2>&1 | tee project-evidence/aws-verify.txt
          elif [[ "$LAB_ACTION" == cleanup ]]; then
            {
              helm uninstall studyslot -n studyslot --wait
              kubectl -n studyslot delete pvc -l app=studyslot-postgres
              kubectl -n studyslot delete pvc data-postgres-0 --ignore-not-found=true --wait=true
              kubectl -n studyslot get pods,pvc
            } 2>&1 | tee project-evidence/aws-cleanup.txt
          fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: studyslot-aws-evidence
          path: project-evidence
