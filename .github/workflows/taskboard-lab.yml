name: TaskBoard session 21 lab
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with: {python-version: '3.14'}
      - uses: actions/setup-node@v7.0.0
        with: {node-version: '22'}
      - name: Direct backend and migrations
        run: |
          set -euo pipefail
          mkdir -p lab-evidence
          bash session21-final-project/run-backend.sh 2>&1 | tee lab-evidence/direct-backend.txt
      - name: Pytest and frontend build
        run: |
          set -euo pipefail
          cd session21-final-project/taskboard/backend
          pip install -r requirements.txt
          pytest -q
          cd ../frontend
          npm ci
          npm run build
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: taskboard-direct-evidence
          path: lab-evidence
  images:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Build, run and exercise TaskBoard
        run: |
          set -euo pipefail
          mkdir -p lab-evidence
          bash session21-final-project/run-compose.sh 2>&1 | tee lab-evidence/compose.txt
          docker tag taskboard-lab-backend "ghcr.io/archit0k/taskboard-backend:${GITHUB_SHA}"
          docker tag taskboard-lab-frontend "ghcr.io/archit0k/taskboard-frontend:${GITHUB_SHA}"
      - name: Verify and install Trivy
        run: |
          curl -fsSL --retry 3 -o /tmp/trivy.tar.gz https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_Linux-64bit.tar.gz
          curl -fsSL --retry 3 -o /tmp/trivy-checksums.txt https://github.com/aquasecurity/trivy/releases/download/v0.75.0/trivy_0.75.0_checksums.txt
          cd /tmp
          grep ' trivy_0.75.0_Linux-64bit.tar.gz$' trivy-checksums.txt | sed 's/trivy_0.75.0_Linux-64bit.tar.gz/trivy.tar.gz/' | sha256sum -c -
          tar -xzf trivy.tar.gz trivy
      - name: Scan both images
        run: |
          scan_status=0
          for app in backend frontend; do
            /tmp/trivy image --scanners vuln --severity HIGH,CRITICAL --exit-code 1 --format table --output "lab-evidence/${app}-scan.txt" "ghcr.io/archit0k/taskboard-${app}:${GITHUB_SHA}" || scan_status=1
            cat "lab-evidence/${app}-scan.txt"
          done
          exit "$scan_status"
      - name: Publish tested SHA
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker push "ghcr.io/archit0k/taskboard-backend:${GITHUB_SHA}"
          docker push "ghcr.io/archit0k/taskboard-frontend:${GITHUB_SHA}"
      - name: Export the tested images for the local and AWS lab
        run: |
          docker save "ghcr.io/archit0k/taskboard-backend:${GITHUB_SHA}" "ghcr.io/archit0k/taskboard-frontend:${GITHUB_SHA}" | gzip > taskboard-images.tar.gz
      - uses: actions/upload-artifact@v7.0.1
        with:
          name: taskboard-tested-images
          path: taskboard-images.tar.gz
          retention-days: 3
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: taskboard-lab-evidence
          path: lab-evidence
  deploy:
    needs: images
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/download-artifact@v7.0.0
        with:
          name: taskboard-tested-images
      - name: Install verified cluster tools
        run: |
          set -euo pipefail
          curl -fsSL --retry 3 -o /tmp/kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          curl -fsSL --retry 3 -o /tmp/kind.sha256sum https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64.sha256sum
          curl -fsSL --retry 3 -o /tmp/helm.tar.gz https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz
          curl -fsSL --retry 3 -o /tmp/helm.sha256sum https://get.helm.sh/helm-v3.22.0-linux-amd64.tar.gz.sha256sum
          cd /tmp
          echo "$(cut -d ' ' -f 1 kind.sha256sum)  kind" | sha256sum -c -
          echo "$(cut -d ' ' -f 1 helm.sha256sum)  helm.tar.gz" | sha256sum -c -
          chmod +x kind
          tar -xzf helm.tar.gz
          sudo install linux-amd64/helm /usr/local/bin/helm
          helm version --short
          kind create cluster --name taskboard-ci --image kindest/node:v1.35.8@sha256:07b2536e30b803ed61d1677a79df6115f798ce64c80f9e22f6ed45afd09323c0 --wait 120s
      - name: Deploy and check the tested images
        run: |
          set -euo pipefail
          mkdir -p lab-evidence
          docker load -i taskboard-images.tar.gz
          /tmp/kind load docker-image "ghcr.io/archit0k/taskboard-backend:${GITHUB_SHA}" "ghcr.io/archit0k/taskboard-frontend:${GITHUB_SHA}" --name taskboard-ci
          bash session21-final-project/run-ci-deploy.sh "$GITHUB_SHA" 2>&1 | tee lab-evidence/kubernetes.txt
      - uses: actions/upload-artifact@v7.0.1
        if: always()
        with:
          name: taskboard-kubernetes-evidence
          path: lab-evidence
      - name: Remove the runner cluster
        if: always()
        run: /tmp/kind delete cluster --name taskboard-ci
