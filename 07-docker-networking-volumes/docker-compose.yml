services:
  frontend:
    image: nginx:1.27-alpine
    container_name: homework-frontend
    volumes:
      - ./frontend/index.html:/usr/share/nginx/html/index.html:ro
    ports:
      - "8090:80"
    networks:
      - frontend-network

  backend:
    image: alpine:3.21
    container_name: homework-backend
    command: ["sh", "-c", "while true; do sleep 3600; done"]
    networks:
      - frontend-network
      - backend-network

  database:
    image: mysql:8.4
    container_name: homework-database
    environment:
      MYSQL_ROOT_PASSWORD: homework-root-password
      MYSQL_DATABASE: homework
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - backend-network
      - database-network

networks:
  frontend-network:
    driver: bridge
  backend-network:
    driver: bridge
  database-network:
    driver: bridge

volumes:
  mysql-data:
