apiVersion: apps/v1
kind: Deployment
metadata:
  name: homework-api
spec:
  replicas: 2
  selector:
    matchLabels: {app: homework-api}
  template:
    metadata:
      labels: {app: homework-api}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: app
          image: homework-api:ci
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 5000}]
          resources:
            requests: {cpu: 25m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
          readinessProbe:
            httpGet: {path: /health, port: 5000}
          livenessProbe:
            httpGet: {path: /health, port: 5000}
            initialDelaySeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
---
apiVersion: v1
kind: Service
metadata:
  name: homework-api
spec:
  selector: {app: homework-api}
  ports: [{port: 80, targetPort: 5000}]
