apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: studyslot
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/archit0k/Devops-HW.git
    targetRevision: main
    path: project/helm/studyslot
    helm:
      releaseName: studyslot
      valueFiles: [../../gitops/values-local.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: studyslot
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
  ignoreDifferences:
    - group: apps
      kind: Deployment
      name: backend
      jsonPointers: [/spec/replicas]
