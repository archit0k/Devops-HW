alertmanager:
  enabled: false
grafana:
  image:
    tag: 12.1.1
  admin:
    existingSecret: studyslot-grafana
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 1, memory: 1Gi}
prometheus:
  prometheusSpec:
    retention: 2h
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorNamespaceSelector: {}
    resources:
      requests: {cpu: 100m, memory: 256Mi}
      limits: {cpu: 500m, memory: 1Gi}
