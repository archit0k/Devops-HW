<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StudySlot presentation — Archit Kulkarni</title>
<style>body{margin:0;background:#182c29;color:#fff;font:16px Arial;overflow:hidden}main{max-width:1280px;margin:auto}img{display:block;width:100%;height:calc(100vh - 68px);object-fit:contain}nav{display:flex;justify-content:space-between;align-items:center;padding:12px}button{background:#e5ebdf;color:#23423c;border:0;padding:10px 24px;cursor:pointer;font:inherit}</style></head>
<body><main><img id="slide" alt="StudySlot presentation, slide 1" src="slides/slide-01.png"><nav><button id="previous">Previous</button><span id="count">1 / 10</span><button id="next">Next</button></nav></main>
<script>let i=1;function show(){document.querySelector('#slide').src=`slides/slide-${String(i).padStart(2,'0')}.png`;document.querySelector('#slide').alt=`StudySlot presentation, slide ${i}`;document.querySelector('#count').textContent=`${i} / 10`;}document.querySelector('#next').onclick=()=>{i=Math.min(10,i+1);show()};document.querySelector('#previous').onclick=()=>{i=Math.max(1,i-1);show()};</script></body></html>
